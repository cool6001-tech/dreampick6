<style>
:root{--bg:#020510;--panel:#060d1f;--card:#0a1528;--az:#00d4ff;--vi:#7b2fff;--go:#ffd700;--gr:#00ff88;--pk:#ff2d78;--bd:rgba(0,212,255,0.18);--tx:#e8f4ff;--dim:#5a7a99;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg);color:var(--tx);font-family:'Noto Sans KR',sans-serif;min-height:100vh;}
.gb{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(0,212,255,0.04)1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,0.04)1px,transparent 1px);background-size:48px 48px;}
.gb::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(0,80,180,0.18),transparent 70%);}
.sl{position:fixed;inset:0;z-index:1;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.07)2px,rgba(0,0,0,0.07)4px);}
.w{position:relative;z-index:2;max-width:900px;margin:0 auto;padding:0 16px 80px;}
.hd{text-align:center;padding:28px 0 18px;}
.lr{display:inline-flex;align-items:center;gap:13px;margin-bottom:8px;}
.li{width:44px;height:44px;border:2px solid var(--az);border-radius:12px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 18px rgba(0,212,255,0.5);animation:pg 2.8s ease-in-out infinite;}
@keyframes pg{0%,100%{box-shadow:0 0 18px rgba(0,212,255,0.5);}50%{box-shadow:0 0 28px rgba(0,212,255,0.8);}}
.lt{font-family:'Orbitron',monospace;font-size:clamp(1.5rem,4vw,2.2rem);font-weight:900;background:linear-gradient(135deg,#fff,var(--az)50%,var(--vi));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.sl2{font-family:'Share Tech Mono',monospace;font-size:0.7rem;color:var(--dim);letter-spacing:0.12em;text-transform:uppercase;margin-top:4px;}
.sl2 b{color:var(--az);font-weight:400;}
.hl{width:100%;height:1px;margin-top:18px;background:linear-gradient(90deg,transparent,var(--az),var(--vi),transparent);}
.p{background:var(--panel);border:1px solid var(--bd);border-radius:14px;padding:18px;position:relative;overflow:hidden;margin-bottom:14px;}
.p::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 70% 50% at 50% -10%,rgba(0,212,255,0.05),transparent 70%);pointer-events:none;}
.pl{font-family:'Share Tech Mono',monospace;font-size:0.56rem;color:var(--az);letter-spacing:0.2em;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.pl::before{content:'//';opacity:0.5;}
.cd{position:absolute;width:12px;height:12px;border-color:var(--az);border-style:solid;opacity:0.33;}
.cd.tl{top:7px;left:7px;border-width:2px 0 0 2px;}.cd.tr{top:7px;right:7px;border-width:2px 2px 0 0;}
.cd.bl{bottom:7px;left:7px;border-width:0 0 2px 2px;}.cd.br{bottom:7px;right:7px;border-width:0 2px 2px 0;}
.ta{width:100%;min-height:110px;background:var(--card);border:1px solid var(--bd);border-radius:10px;color:var(--tx);font-family:'Noto Sans KR',sans-serif;font-size:0.87rem;line-height:1.7;padding:12px;resize:vertical;outline:none;}
.ta::placeholder{color:var(--dim);font-style:italic;}
.ta:focus{border-color:var(--az);}
.btn{width:100%;margin-top:10px;padding:13px;background:transparent;border:2px solid var(--az);border-radius:10px;color:var(--az);font-family:'Orbitron',monospace;font-size:0.8rem;font-weight:700;letter-spacing:0.15em;cursor:pointer;position:relative;overflow:hidden;transition:all .3s;}
.btn:hover:not(:disabled){background:rgba(0,212,255,0.08);color:#fff;}
.btn:disabled{opacity:.44;cursor:not-allowed;}
.cl{position:absolute;top:50%;left:-100%;width:100%;height:1px;background:linear-gradient(90deg,transparent,var(--az),transparent);animation:cs 1.2s linear infinite;}
@keyframes cs{to{left:100%;}}
.et{background:rgba(255,45,120,.1);border:1px solid rgba(255,45,120,.33);border-radius:8px;padding:8px 12px;font-family:'Share Tech Mono',monospace;font-size:0.68rem;color:var(--pk);margin-top:8px;}
.dg{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-bottom:13px;}
@media(max-width:540px){.dg{grid-template-columns:1fr;}}
/* OVERLAY */
.dv-overlay{position:fixed;inset:0;z-index:100;pointer-events:none;display:flex;align-items:center;justify-content:center;}
.dv-bd{position:absolute;inset:0;background:#020510;animation:bdIn .35s ease forwards;}
.dv-overlay.exit .dv-bd{animation:bdOut .7s ease forwards;}
@keyframes bdIn{from{opacity:0;}to{opacity:1;}}@keyframes bdOut{from{opacity:1;}to{opacity:0;}}
.dv-c{position:absolute;width:100vw;height:100vh;overflow:hidden;animation:spEx .7s cubic-bezier(.22,1,.36,1) forwards;z-index:1;}
@keyframes spEx{0%{opacity:0;transform:scale(.05) rotate(-540deg);border-radius:50%;}60%{opacity:1;transform:scale(1.04) rotate(10deg);}100%{opacity:1;transform:scale(1) rotate(0deg);border-radius:0;}}
.dv-overlay.exit .dv-c{animation:spCo .85s cubic-bezier(.55,0,1,.45) forwards;}
@keyframes spCo{0%{opacity:1;transform:scale(1);}75%{opacity:.7;transform:scale(.08) rotate(420deg);border-radius:50%;}100%{opacity:0;transform:scale(.04) rotate(540deg);}}
.dv-scan{position:absolute;left:0;right:0;height:3px;top:-3px;background:linear-gradient(90deg,transparent,rgba(0,212,255,.9),transparent);animation:sw 1.1s linear 2;}
@keyframes sw{to{top:100%;}}
.dv-gl{position:absolute;inset:0;animation:gl 1.8s ease forwards;}
@keyframes gl{0%,100%,8%,23%,56%{background:none;}7%{background:rgba(0,212,255,.07);}22%{background:rgba(123,47,255,.05);}55%{background:rgba(0,212,255,.04);}}
.dv-co{position:absolute;width:42px;height:42px;border-color:var(--az);border-style:solid;}
.dv-co.tl{top:20px;left:20px;border-width:2px 0 0 2px;}.dv-co.tr{top:20px;right:20px;border-width:2px 2px 0 0;}
.dv-co.bl{bottom:20px;left:20px;border-width:0 0 2px 2px;}.dv-co.br{bottom:20px;right:20px;border-width:0 2px 2px 0;}
.dv-xh{position:absolute;top:50%;left:50%;width:88px;height:88px;animation:xhF 1.8s ease forwards;}
@keyframes xhF{0%{opacity:0;transform:translate(-50%,-50%) scale(2.5) rotate(-90deg);}25%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0deg);}80%{opacity:1;}100%{opacity:0;transform:translate(-50%,-50%);}}
.dv-tag{position:absolute;top:28px;left:50%;transform:translateX(-50%);font-family:'Orbitron',monospace;font-size:.66rem;color:rgba(0,212,255,.7);letter-spacing:.3em;white-space:nowrap;padding:4px 14px;border:1px solid rgba(0,212,255,.25);border-radius:20px;background:rgba(0,212,255,.06);animation:tgA 1.8s ease forwards;}
@keyframes tgA{0%{opacity:0;}25%{opacity:1;}80%{opacity:1;}100%{opacity:0;}}
.dv-st{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);font-family:'Share Tech Mono',monospace;font-size:.7rem;color:var(--az);letter-spacing:.2em;animation:stB .45s ease infinite alternate;}
@keyframes stB{from{opacity:.4;}to{opacity:1;}}
/* DREAM CARD */
.dc-wrap{padding:0;margin-bottom:0;animation:cIn .55s cubic-bezier(.34,1.4,.64,1) forwards;}
@keyframes cIn{0%{opacity:0;transform:scale(.06) rotate(360deg);border-radius:50%;}60%{opacity:1;transform:scale(1.05) rotate(-8deg);}100%{opacity:1;transform:scale(1) rotate(0deg);border-radius:14px;}}
.dc{aspect-ratio:4/3;border-radius:12px;overflow:hidden;position:relative;border:1px solid var(--bd);background:#020510;}
.dc svg{width:100%;height:100%;display:block;}
.dc-wrap .dc{animation:gP 1.6s ease .4s forwards;box-shadow:none;}
@keyframes gP{45%{box-shadow:0 0 35px rgba(0,212,255,.55);}100%{box-shadow:0 0 8px rgba(0,212,255,.14);}}
.dc-ot{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(2,5,16,.15)0%,transparent 35%,rgba(2,5,16,.7)65%,rgba(2,5,16,.92)100%);display:flex;flex-direction:column;justify-content:flex-end;padding:13px;}
.dc-dt{font-size:.74rem;color:rgba(232,244,255,.9);line-height:1.5;font-style:italic;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.dc-it{font-size:.65rem;color:rgba(0,212,255,.85);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.dc-tr{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:center;}
.dc-badge{font-family:'Share Tech Mono',monospace;font-size:.5rem;color:rgba(0,212,255,.6);letter-spacing:.1em;background:rgba(2,5,16,.65);padding:2px 7px;border-radius:4px;border:1px solid rgba(0,212,255,.2);}
.dc-lbl{font-family:'Share Tech Mono',monospace;font-size:.5rem;color:rgba(0,212,255,.4);}
/* GAUGES */
.gau{display:flex;flex-direction:column;gap:13px;}
.gh{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
.gn{font-family:'Share Tech Mono',monospace;font-size:.62rem;color:var(--dim);}
.gv{font-family:'Orbitron',monospace;font-size:.9rem;font-weight:700;}
.gu{font-family:'Share Tech Mono',monospace;font-size:.5rem;color:var(--dim);margin-left:2px;}
.gtr{height:7px;background:rgba(255,255,255,.05);border-radius:4px;overflow:hidden;position:relative;}
.gf{height:100%;border-radius:4px;transition:width 1.4s cubic-bezier(.23,1,.32,1);width:0%;}
.gtk{position:absolute;top:-2px;bottom:-2px;width:1px;background:rgba(255,255,255,.1);}
.gw .gv{color:var(--go);}.gw .gf{background:linear-gradient(90deg,#7a5200,var(--go));}
.gl .gv{color:var(--pk);}.gl .gf{background:linear-gradient(90deg,#5a0020,var(--pk));}
.gs .gv{color:var(--gr);}.gs .gf{background:linear-gradient(90deg,#004520,var(--gr));}
.pr{margin-top:7px;padding-top:9px;border-top:1px solid rgba(0,212,255,.08);}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
.plb{font-family:'Share Tech Mono',monospace;font-size:.6rem;color:var(--dim);}
.pv{font-family:'Orbitron',monospace;font-size:.95rem;font-weight:700;color:var(--az);}
.pv span{font-family:'Share Tech Mono',monospace;font-size:.52rem;color:var(--dim);}
.pt{height:5px;background:rgba(0,212,255,.07);border-radius:3px;overflow:hidden;}
.pf{height:100%;border-radius:3px;background:linear-gradient(90deg,rgba(0,80,180,.6),var(--az));transition:width 1.6s cubic-bezier(.23,1,.32,1);width:0%;}
/* BALLS */
.balls{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;padding:14px 0 8px;}
.ball{width:74px;height:74px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Orbitron',monospace;font-weight:900;font-size:1.25rem;position:relative;cursor:default;transform:scale(0);transition:transform .5s cubic-bezier(.34,1.56,.64,1);}
.ball.on{transform:scale(1);}
.ball::after{content:'';position:absolute;top:6px;left:9px;width:9px;height:5px;background:rgba(255,255,255,.35);border-radius:50%;filter:blur(2px);}
.b1{background:radial-gradient(circle at 30% 30%,#ffd0a0,#ff6b00);color:#fff;box-shadow:0 0 28px rgba(255,107,0,.9),0 0 8px rgba(255,107,0,.5);text-shadow:0 1px 4px rgba(0,0,0,.5);}
.b2{background:radial-gradient(circle at 30% 30%,#b0fff0,#00d4ff);color:#001a2c;box-shadow:0 0 28px rgba(0,212,255,.9),0 0 8px rgba(0,212,255,.5);text-shadow:0 1px 2px rgba(0,100,150,.3);}
.b3{background:radial-gradient(circle at 30% 30%,#d8b4fe,#7b2fff);color:#fff;box-shadow:0 0 28px rgba(123,47,255,.9),0 0 8px rgba(123,47,255,.5);text-shadow:0 1px 4px rgba(0,0,0,.5);}
.b4{background:radial-gradient(circle at 30% 30%,#fff0a0,#ffd700);color:#1a0a00;box-shadow:0 0 28px rgba(255,215,0,.9),0 0 8px rgba(255,215,0,.5);text-shadow:0 1px 2px rgba(150,100,0,.2);}
.b5{background:radial-gradient(circle at 30% 30%,#ffb0c8,#ff2d78);color:#fff;box-shadow:0 0 28px rgba(255,45,120,.9),0 0 8px rgba(255,45,120,.5);text-shadow:0 1px 4px rgba(0,0,0,.5);}
.b6{background:radial-gradient(circle at 30% 30%,#a0ffd0,#00ff88);color:#001a10;box-shadow:0 0 28px rgba(0,255,136,.9),0 0 8px rgba(0,255,136,.5);text-shadow:0 1px 2px rgba(0,80,40,.2);}
.bsm{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Orbitron',monospace;font-weight:900;font-size:.72rem;}
.smball{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Orbitron',monospace;font-weight:700;font-size:.75rem;opacity:0.8;filter:brightness(0.85);}
/* 번호풀이 */
.ne{background:var(--card);border-radius:10px;padding:11px 13px;border-left:3px solid var(--az);animation:fi .35s ease;margin-bottom:8px;}
.nt{display:flex;align-items:center;gap:9px;margin-bottom:6px;}
.nb{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Orbitron',monospace;font-weight:900;font-size:.75rem;flex-shrink:0;}
.nk{font-family:'Share Tech Mono',monospace;font-size:.61rem;color:var(--az);letter-spacing:.1em;}
.nr{font-size:.82rem;line-height:1.75;color:rgba(232,244,255,.82);font-weight:300;}
/* 해몽 */
.it{font-size:.85rem;line-height:1.9;color:rgba(232,244,255,.85);font-weight:300;min-height:60px;white-space:pre-wrap;}
.ic{display:inline-block;width:6px;height:1em;background:var(--az);animation:bk .8s step-end infinite;vertical-align:text-bottom;margin-left:2px;}
@keyframes bk{50%{opacity:0;}}
/* 공유 패널 */
.sp{background:var(--panel);border:1px solid rgba(0,212,255,.2);border-radius:14px;padding:16px 18px;margin-bottom:14px;position:relative;}
.sb{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;}
@media(max-width:480px){.sb{grid-template-columns:1fr;}}
.sbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:12px 7px;border-radius:10px;cursor:pointer;border:1px solid rgba(255,255,255,.08);background:var(--card);transition:all .25s;user-select:none;}
.sbtn:hover{transform:translateY(-2px);}
.si{font-size:1.3rem;}
.sl3{font-family:'Share Tech Mono',monospace;font-size:.57rem;letter-spacing:.07em;text-align:center;line-height:1.4;}
.sbtn.lk{border-color:rgba(0,212,255,.3);color:var(--az);}
.sbtn.pg{border-color:rgba(0,255,136,.3);color:var(--gr);}
.sbtn.kk{background:#FEE500;color:#3C1E1E;border-color:#FEE500;}
.sbtn.kk .sl3{color:#3C1E1E;}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:rgba(0,212,255,.15);border:1px solid var(--az);color:var(--az);padding:9px 20px;border-radius:20px;font-family:'Share Tech Mono',monospace;font-size:.7rem;z-index:9999;animation:fi .3s ease;white-space:nowrap;}
/* 쿠팡 패널 */
.cp{margin-bottom:14px;border-radius:14px;overflow:hidden;position:relative;border:1px solid var(--cpb,rgba(255,215,0,.25));}
.cp::before{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 80% 50% at 50% -5%,var(--cpg,rgba(255,215,0,.07)),transparent 65%);}
.cpi{background:var(--panel);padding:18px;position:relative;}
.cph{display:flex;align-items:center;gap:11px;margin-bottom:11px;}
.cpo{font-size:1.4rem;animation:oF 3s ease-in-out infinite;}
@keyframes oF{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}
.cpn{font-family:'Orbitron',monospace;font-size:.9rem;font-weight:900;background:linear-gradient(135deg,#fff,var(--cpc,#ffd700));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.cps{font-size:.68rem;color:var(--dim);margin-top:2px;}
.cpt{display:flex;border:1px solid rgba(255,255,255,.08);border-radius:8px;overflow:hidden;margin-bottom:12px;}
.cptb{flex:1;padding:7px 0;text-align:center;cursor:pointer;font-family:'Share Tech Mono',monospace;font-size:.62rem;color:var(--dim);background:transparent;border:none;transition:all .25s;}
.cptb.act{font-weight:700;}
.cpr{font-size:.81rem;line-height:1.75;color:rgba(232,244,255,.75);font-weight:300;margin-bottom:12px;padding:9px 11px;background:rgba(255,255,255,.03);border-radius:8px;border-left:2px solid var(--cpc,#ffd700);}
.cpg{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px;}
@media(max-width:540px){.cpg{grid-template-columns:1fr;}}
.cpit{background:var(--card);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:12px 10px;display:flex;flex-direction:column;gap:5px;position:relative;transition:border-color .25s,transform .2s;cursor:pointer;text-decoration:none;}
.cpit:hover{transform:translateY(-2px);}
.cptg{position:absolute;top:7px;right:7px;font-family:'Share Tech Mono',monospace;font-size:.48rem;font-weight:700;padding:2px 6px;border-radius:10px;background:var(--cpc,#ffd700);color:#020510;}
.cpem{font-size:1.4rem;line-height:1;}
.cpnm{font-size:.78rem;font-weight:500;color:var(--tx);line-height:1.35;}
.cppr{font-family:'Orbitron',monospace;font-size:.73rem;font-weight:700;color:var(--cpc,#ffd700);}
.cpbt{margin-top:3px;padding:5px 7px;background:transparent;border:1px solid var(--cpc,#ffd700);border-radius:6px;color:var(--cpc,#ffd700);font-family:'Share Tech Mono',monospace;font-size:.56rem;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;}
.cpit:hover .cpbt{background:var(--cpc,#ffd700);color:#020510;}
.cpf{display:flex;align-items:center;justify-content:space-between;padding-top:11px;border-top:1px solid rgba(255,255,255,.06);}
.cpnt{font-family:'Share Tech Mono',monospace;font-size:.53rem;color:var(--dim);line-height:1.6;}
.cpnt b{display:block;font-size:.57rem;margin-bottom:1px;}
.cpab{padding:6px 12px;border-radius:8px;border:1.5px solid var(--cpc,#ffd700);background:transparent;color:var(--cpc,#ffd700);font-family:'Orbitron',monospace;font-size:.58rem;font-weight:700;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:3px;transition:all .25s;}
.cpab:hover{background:var(--cpc,#ffd700);color:#020510;}
/* 저널 */
.js{margin-top:24px;}
.jt{font-family:'Orbitron',monospace;font-size:.8rem;font-weight:700;color:var(--vi);letter-spacing:.1em;margin-bottom:12px;display:flex;align-items:center;gap:10px;}
.jt::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(123,47,255,.4),transparent);}
.tl{position:relative;padding-left:18px;}
.tl::before{content:'';position:absolute;left:5px;top:0;bottom:0;width:1px;background:linear-gradient(180deg,var(--vi),transparent);}
.ji{position:relative;margin-bottom:12px;}
.jdot{position:absolute;left:-15px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--vi);box-shadow:0 0 6px rgba(123,47,255,.8);border:2px solid var(--panel);}
.ji.open .jdot{background:#fff;}
.jc{background:var(--card);border:1px solid rgba(123,47,255,.18);border-radius:12px;overflow:hidden;}
.jh{display:flex;align-items:center;gap:9px;padding:11px 13px;cursor:pointer;user-select:none;}
.jch{font-size:.58rem;color:var(--vi);transition:transform .3s;margin-left:auto;opacity:.7;}
.ji.open .jch{transform:rotate(180deg);}
.jm{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0;}
.jd{font-family:'Share Tech Mono',monospace;font-size:.58rem;color:var(--dim);}
.jdr{font-size:.78rem;color:rgba(232,244,255,.75);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.jsc{font-family:'Orbitron',monospace;font-size:.63rem;color:var(--go);white-space:nowrap;}
.jbm{display:flex;gap:3px;flex-shrink:0;}
.mb{width:19px;height:19px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Orbitron',monospace;font-size:.4rem;font-weight:900;}
.jb{display:none;padding:0 13px 14px;border-top:1px solid rgba(123,47,255,.12);}
.ji.open .jb{display:block;animation:fi .3s ease;}
.jeg{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:12px 0;}
@media(max-width:460px){.jeg{grid-template-columns:1fr;}}
.jeb{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;padding:8px 0;}
.jei{font-size:.8rem;line-height:1.85;color:rgba(232,244,255,.8);font-weight:300;margin-top:10px;padding-top:10px;border-top:1px solid rgba(0,212,255,.07);}
.jeil{font-family:'Share Tech Mono',monospace;font-size:.55rem;color:var(--az);letter-spacing:.15em;margin-bottom:6px;opacity:.7;}
.sn{font-family:'Share Tech Mono',monospace;font-size:.56rem;color:var(--dim);margin-top:9px;display:flex;align-items:center;gap:5px;}
.snd{width:5px;height:5px;border-radius:50%;background:var(--gr);box-shadow:0 0 5px rgba(0,255,136,.6);}
.da{animation:fi .5s ease;}
@keyframes fi{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
.ld span{animation:lb2 1.2s step-end infinite;}.ld span:nth-child(2){animation-delay:.2s;}.ld span:nth-child(3){animation-delay:.4s;}
@keyframes lb2{50%{opacity:.1;}}

/* ── 하단 동의 배너 ── */
.consent-banner{
  position:fixed;bottom:0;left:0;right:0;z-index:9000;
  background:rgba(6,13,31,0.97);
  border-top:1px solid rgba(0,212,255,0.25);
  backdrop-filter:blur(12px);
  padding:14px 20px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  box-shadow:0 -4px 30px rgba(0,0,0,0.5);
  animation:bannerUp .4s cubic-bezier(.22,1,.36,1);
}
@keyframes bannerUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
.consent-banner.hide{animation:bannerDown .35s ease forwards;}
@keyframes bannerDown{to{transform:translateY(110%);}}
.consent-icon{font-size:1.3rem;flex-shrink:0;}
.consent-text{flex:1;min-width:220px;font-size:0.78rem;color:rgba(232,244,255,0.78);line-height:1.65;}
.consent-text a{color:var(--az);text-decoration:underline;cursor:pointer;}
.consent-text .cp-note{display:block;font-size:0.68rem;color:var(--dim);margin-top:4px;}
.consent-btns{display:flex;gap:8px;flex-shrink:0;}
.consent-btn-agree{
  padding:9px 22px;border-radius:8px;
  background:var(--az);color:#020510;
  font-family:'Orbitron',monospace;font-size:0.72rem;font-weight:700;
  letter-spacing:0.08em;cursor:pointer;border:none;
  transition:all .2s;white-space:nowrap;
}
.consent-btn-agree:hover{background:#fff;box-shadow:0 0 16px rgba(0,212,255,0.5);}
.consent-btn-detail{
  padding:9px 16px;border-radius:8px;
  background:transparent;color:var(--az);
  font-family:'Share Tech Mono',monospace;font-size:0.68rem;
  letter-spacing:0.06em;cursor:pointer;
  border:1px solid rgba(0,212,255,0.35);
  white-space:nowrap;transition:all .2s;
}
.consent-btn-detail:hover{background:rgba(0,212,255,0.08);}

/* ── 푸터 ── */
.footer{
  text-align:center;padding:28px 16px 100px;
  border-top:1px solid rgba(0,212,255,0.08);
  margin-top:20px;
}
.footer-links{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;margin-bottom:10px;}
.footer-link{font-family:'Share Tech Mono',monospace;font-size:0.6rem;color:var(--dim);letter-spacing:0.1em;cursor:pointer;text-decoration:underline;}
.footer-link:hover{color:var(--az);}
.footer-copy{font-family:'Share Tech Mono',monospace;font-size:0.58rem;color:var(--dim);opacity:0.6;letter-spacing:0.08em;}
.footer-coupang{font-size:0.62rem;color:var(--dim);margin-top:6px;opacity:0.7;}

/* ── 약관 모달 ── */
.modal-overlay{
  position:fixed;inset:0;z-index:9100;
  background:rgba(2,5,16,0.88);backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;padding:20px;
  animation:fi .25s ease;
}
.modal-box{
  background:var(--panel);border:1px solid rgba(0,212,255,0.25);
  border-radius:16px;width:100%;max-width:560px;max-height:80vh;
  overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 0 60px rgba(0,0,0,0.6);
}
.modal-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px;border-bottom:1px solid rgba(0,212,255,0.15);
  flex-shrink:0;
}
.modal-title{font-family:'Orbitron',monospace;font-size:0.88rem;font-weight:700;color:var(--az);}
.modal-close{background:transparent;border:1px solid rgba(0,212,255,0.2);border-radius:6px;color:var(--dim);font-size:0.8rem;padding:4px 10px;cursor:pointer;transition:all .2s;}
.modal-close:hover{border-color:var(--az);color:var(--az);}
.modal-tabs{display:flex;border-bottom:1px solid rgba(0,212,255,0.12);flex-shrink:0;}
.modal-tab{flex:1;padding:10px;text-align:center;cursor:pointer;font-family:'Share Tech Mono',monospace;font-size:0.6rem;letter-spacing:0.1em;color:var(--dim);border-bottom:2px solid transparent;transition:all .2s;}
.modal-tab.act{color:var(--az);border-bottom-color:var(--az);}
.modal-body{padding:20px;overflow-y:auto;flex:1;font-size:0.83rem;line-height:1.8;color:rgba(232,244,255,0.82);}
.modal-body h3{font-size:0.85rem;color:var(--az);margin:16px 0 8px;font-family:'Share Tech Mono',monospace;letter-spacing:0.1em;}
.modal-body h3::before{content:"◆ ";opacity:0.6;font-size:0.65rem;}
.modal-body p{margin-bottom:10px;}
.modal-body ul{padding-left:18px;margin-bottom:10px;}
.modal-body li{margin-bottom:4px;}
.modal-body .warn-box{background:rgba(255,215,0,0.05);border:1px solid rgba(255,215,0,0.25);border-radius:8px;padding:12px 14px;margin:10px 0;}
.modal-footer{padding:14px 20px;border-top:1px solid rgba(0,212,255,0.12);display:flex;justify-content:flex-end;flex-shrink:0;}
.modal-agree-btn{padding:10px 28px;border-radius:8px;background:var(--az);color:#020510;font-family:'Orbitron',monospace;font-size:0.75rem;font-weight:700;letter-spacing:0.1em;cursor:pointer;border:none;}

/* ── 오행 배너 ── */
.oh-banner{
  border-radius:12px;padding:14px 16px;margin-bottom:14px;
  position:relative;overflow:hidden;
  display:flex;align-items:center;gap:14px;
}
.oh-banner::before{content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 80% 60% at 0% 50%,var(--oh-glow,.2),transparent 70%);
  pointer-events:none;}
.oh-orb{
  width:52px;height:52px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:1.4rem;
  border:2px solid var(--oh-c,#ffd700);
  box-shadow:0 0 16px var(--oh-glow,rgba(255,215,0,.4));
  background:rgba(0,0,0,.3);
}
.oh-body{flex:1;}
.oh-label{font-family:'Share Tech Mono',monospace;font-size:.55rem;
  color:var(--oh-c,#ffd700);letter-spacing:.18em;opacity:.75;margin-bottom:3px;}
.oh-name{font-family:'Orbitron',monospace;font-size:1rem;font-weight:900;
  color:var(--oh-c,#ffd700);margin-bottom:4px;}
.oh-reason{font-size:.79rem;line-height:1.65;color:rgba(232,244,255,.78);font-weight:300;}
.oh-cycle{
  margin-top:12px;padding-top:10px;
  border-top:1px solid rgba(255,255,255,.06);
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
}
.oh-cycle-label{font-family:'Share Tech Mono',monospace;font-size:.55rem;
  color:var(--dim);letter-spacing:.1em;}
.oh-pill{
  padding:3px 9px;border-radius:12px;
  font-family:'Share Tech Mono',monospace;font-size:.58rem;
  letter-spacing:.06em;
}
.oh-pill.main{background:var(--oh-c,#ffd700);color:#020510;font-weight:700;}
.oh-pill.sang{background:rgba(255,255,255,.08);color:rgba(232,244,255,.7);
  border:1px solid rgba(255,255,255,.12);}
.oh-pill.arr{color:var(--dim);font-size:.52rem;}

/* ══════════════════════════════════════
   당첨 확인 & 축하 효과
══════════════════════════════════════ */

/* 당첨 확인 입력 */
.win-check{margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.06);}
.win-check-title{font-family:'Share Tech Mono',monospace;font-size:.56rem;color:var(--dim);letter-spacing:.12em;margin-bottom:8px;}
.win-input-row{display:flex;gap:6px;flex-wrap:wrap;}
.win-num-input{width:46px;height:38px;background:var(--bg);border:1px solid rgba(255,255,255,.12);border-radius:8px;color:var(--tx);font-family:'Orbitron',monospace;font-size:.8rem;font-weight:700;text-align:center;outline:none;transition:border-color .2s;}
.win-num-input:focus{border-color:var(--go);}
.win-bonus-input{width:46px;height:38px;background:var(--bg);border:2px dashed rgba(255,215,0,.3);border-radius:8px;color:var(--go);font-family:'Orbitron',monospace;font-size:.8rem;font-weight:700;text-align:center;outline:none;}
.win-bonus-label{font-family:'Share Tech Mono',monospace;font-size:.5rem;color:var(--dim);letter-spacing:.08em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;}
.win-btn{padding:0 14px;height:38px;background:transparent;border:1px solid var(--go);border-radius:8px;color:var(--go);font-family:'Orbitron',monospace;font-size:.6rem;font-weight:700;letter-spacing:.08em;cursor:pointer;transition:all .2s;white-space:nowrap;}
.win-btn:hover{background:var(--go);color:#020510;}

/* 당첨 결과 뱃지 */
.win-result{margin-top:10px;border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:12px;animation:fi .4s ease;}
.win-result.r1{background:linear-gradient(135deg,rgba(255,215,0,.15),rgba(255,107,0,.1));border:2px solid var(--go);box-shadow:0 0 24px rgba(255,215,0,.3);}
.win-result.r2{background:linear-gradient(135deg,rgba(192,192,192,.12),rgba(0,212,255,.08));border:2px solid #c0c0ff;box-shadow:0 0 16px rgba(192,192,255,.25);}
.win-result.r3{background:rgba(255,107,0,.08);border:1px solid rgba(255,107,0,.35);}
.win-result.r4,.win-result.r5{background:rgba(0,212,255,.05);border:1px solid rgba(0,212,255,.2);}
.win-result.none{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);}
.win-result-icon{font-size:1.6rem;flex-shrink:0;}
.win-result-text{flex:1;}
.win-result-grade{font-family:'Orbitron',monospace;font-size:.9rem;font-weight:900;}
.win-result.r1 .win-result-grade{color:var(--go);}
.win-result.r2 .win-result-grade{color:#c8c8ff;}
.win-result.r3 .win-result-grade{color:#ff8c42;}
.win-result.r4 .win-result-grade,.win-result.r5 .win-result-grade{color:var(--az);}
.win-result-desc{font-size:.75rem;color:rgba(232,244,255,.7);margin-top:2px;}
.win-matched{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap;}
.win-ball-hit{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Orbitron',monospace;font-size:.6rem;font-weight:900;border:2px solid var(--go);box-shadow:0 0 8px rgba(255,215,0,.5);}
.win-ball-miss{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Orbitron',monospace;font-size:.6rem;font-weight:900;background:rgba(255,255,255,.06);color:var(--dim);border:1px solid rgba(255,255,255,.1);}

/* 저널 — 당첨 카드 특수 스타일 */
.ji.winner-1 .jc{border-color:rgba(255,215,0,.7)!important;box-shadow:0 0 30px rgba(255,215,0,.25),0 0 60px rgba(255,215,0,.1);}
.ji.winner-1 .jdot{background:var(--go)!important;box-shadow:0 0 12px rgba(255,215,0,.9)!important;width:12px!important;height:12px!important;left:-18px!important;}
.ji.winner-2 .jc{border-color:rgba(192,192,255,.5)!important;box-shadow:0 0 20px rgba(192,192,255,.2);}
.ji.winner-2 .jdot{background:#c8c8ff!important;box-shadow:0 0 10px rgba(200,200,255,.8)!important;}
.ji.winner-3 .jc{border-color:rgba(255,107,0,.45)!important;box-shadow:0 0 14px rgba(255,107,0,.15);}
.ji.winner-3 .jdot{background:#ff8c42!important;}

/* 핀 뱃지 */
.pin-badge{
  display:inline-flex;align-items:center;gap:5px;
  padding:3px 10px;border-radius:12px;
  font-family:'Share Tech Mono',monospace;font-size:.52rem;
  letter-spacing:.08em;font-weight:700;
  margin-bottom:6px;
}
.pin-badge.g1{background:linear-gradient(90deg,rgba(255,215,0,.2),rgba(255,107,0,.1));color:var(--go);border:1px solid rgba(255,215,0,.4);}
.pin-badge.g2{background:rgba(192,192,255,.1);color:#c8c8ff;border:1px solid rgba(192,192,255,.3);}
.pin-badge.g3{background:rgba(255,107,0,.1);color:#ff8c42;border:1px solid rgba(255,107,0,.3);}

/* 축하 오버레이 (1·2등 당첨 시) */
.confetti-overlay{
  position:fixed;inset:0;z-index:9500;pointer-events:none;
  overflow:hidden;
}
.confetti-msg{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
  animation:confettiPop .6s cubic-bezier(.34,1.56,.64,1) forwards;
  background:rgba(6,13,31,.92);border:2px solid var(--go);
  border-radius:20px;padding:28px 40px;
  box-shadow:0 0 60px rgba(255,215,0,.4);
}
@keyframes confettiPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.3);}100%{opacity:1;transform:translate(-50%,-50%) scale(1);}}
.confetti-grade{font-family:'Orbitron',monospace;font-size:2rem;font-weight:900;color:var(--go);
  text-shadow:0 0 20px rgba(255,215,0,.8);}
.confetti-sub{font-size:.85rem;color:rgba(232,244,255,.8);margin-top:8px;}
.confetti-close{margin-top:18px;padding:9px 24px;background:var(--go);color:#020510;
  border:none;border-radius:8px;font-family:'Orbitron',monospace;font-size:.72rem;
  font-weight:700;cursor:pointer;}
.c-particle{position:absolute;width:8px;height:8px;border-radius:2px;
  animation:cFall linear forwards;}
@keyframes cFall{0%{transform:translateY(-20px) rotate(0deg);opacity:1;}
  100%{transform:translateY(100vh) rotate(720deg);opacity:0;}}

/* ══════════════════════════════════════
   PWA 앱 설치 배너
══════════════════════════════════════ */
.pwa-banner{
  position:fixed;bottom:0;left:0;right:0;z-index:9200;
  background:linear-gradient(135deg,#0a1528,#060d1f);
  border-top:1px solid rgba(0,212,255,0.35);
  padding:14px 18px;
  display:flex;align-items:center;gap:14px;
  box-shadow:0 -6px 30px rgba(0,0,0,0.6);
  animation:pwaUp .45s cubic-bezier(.22,1,.36,1);
}
@keyframes pwaUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
.pwa-banner.hide{animation:pwaDown .3s ease forwards;}
@keyframes pwaDown{to{transform:translateY(110%);}}

.pwa-icon{
  width:48px;height:48px;border-radius:12px;flex-shrink:0;
  background:linear-gradient(135deg,#020510,#0a1528);
  border:1.5px solid rgba(0,212,255,0.4);
  display:flex;align-items:center;justify-content:center;
  font-size:1.4rem;
  box-shadow:0 0 14px rgba(0,212,255,0.3);
}
.pwa-text{flex:1;}
.pwa-title{
  font-family:'Orbitron',monospace;font-size:.82rem;font-weight:700;
  color:var(--tx);margin-bottom:3px;
}
.pwa-desc{
  font-family:'Share Tech Mono',monospace;font-size:.6rem;
  color:var(--dim);letter-spacing:.04em;line-height:1.5;
}
.pwa-desc span{color:var(--az);}
.pwa-btns{display:flex;gap:8px;flex-shrink:0;}
.pwa-btn-install{
  padding:9px 16px;border-radius:8px;
  background:var(--az);color:#020510;
  font-family:'Orbitron',monospace;font-size:.65rem;font-weight:700;
  letter-spacing:.06em;cursor:pointer;border:none;
  white-space:nowrap;transition:all .2s;
  box-shadow:0 0 14px rgba(0,212,255,0.4);
}
.pwa-btn-install:hover{background:#fff;box-shadow:0 0 20px rgba(0,212,255,0.6);}
.pwa-btn-close{
  padding:9px 12px;border-radius:8px;
  background:transparent;color:var(--dim);
  font-size:.75rem;cursor:pointer;
  border:1px solid rgba(255,255,255,.1);
  transition:all .2s;
}
.pwa-btn-close:hover{color:var(--tx);border-color:rgba(255,255,255,.3);}

/* 헤더 내 설치 버튼 (작은 버튼) */
.pwa-header-btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 14px;border-radius:20px;
  background:rgba(0,212,255,0.08);
  border:1px solid rgba(0,212,255,0.3);
  color:var(--az);font-family:'Share Tech Mono',monospace;
  font-size:.6rem;letter-spacing:.08em;
  cursor:pointer;transition:all .2s;margin-top:8px;
}
.pwa-header-btn:hover{background:rgba(0,212,255,0.15);border-color:var(--az);}
.pwa-header-btn .pwa-dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--az);animation:pg 1.5s ease-in-out infinite;
}

/* iOS 안내 모달 */
.ios-modal{
  position:fixed;inset:0;z-index:9300;
  background:rgba(2,5,16,0.88);backdrop-filter:blur(8px);
  display:flex;align-items:flex-end;justify-content:center;
  padding:20px;
}
.ios-box{
  background:var(--panel);border:1px solid rgba(0,212,255,0.3);
  border-radius:20px;width:100%;max-width:480px;
  padding:24px;position:relative;
  box-shadow:0 -4px 40px rgba(0,0,0,0.5);
}
.ios-title{
  font-family:'Orbitron',monospace;font-size:.95rem;font-weight:700;
  color:var(--az);text-align:center;margin-bottom:6px;

function DreamArt({artType="default",seed=42,dreamText=""}){
  const r=(mn,mx,s)=>{let x=Math.sin(s+1)*10000;return Math.floor((x-Math.floor(x))*(mx-mn)+mn);};
  const kw=dreamText.toLowerCase();
  const has=(...w)=>w.some(v=>kw.includes(v));
  const T={water:{p:"#00d4ff",s:"#0044aa",a:"#7b6fff",bg:"#010a18"},fire:{p:"#ff6b00",s:"#ff2d78",a:"#ffd700",bg:"#110200"},gold:{p:"#ffd700",s:"#ff9900",a:"#00d4ff",bg:"#0d0800"},sky:{p:"#7b2fff",s:"#00d4ff",a:"#00ff88",bg:"#040010"},earth:{p:"#00ff88",s:"#00d4ff",a:"#ffd700",bg:"#001408"},default:{p:"#00d4ff",s:"#7b2fff",a:"#ffd700",bg:"#020510"}};
  const t=T[artType]||T.default;
  const special=()=>{
    if(artType==="water"){const waves=Array.from({length:5},(_,i)=>{const y=28+i*13+r(-4,4,seed+i*7);const pts=Array.from({length:20},(_,j)=>`${j*6} ${y+Math.sin(j*(.08+i*.015)*Math.PI*2+i)*(7+i*2)}`).join(' ');return<polyline key={i} points={pts} fill="none" stroke={i%2===0?t.p:t.a} strokeWidth={.35+i*.12} opacity={.12+i*.1}/>;});const bubs=Array.from({length:10},(_,i)=>({cx:r(5,95,seed+i*11),cy:r(10,90,seed+i*17),r:r(1,4,seed+i*23),op:.07+i*.04}));return<>{waves}{bubs.map((b,i)=><circle key={i} cx={b.cx} cy={b.cy} r={b.r} fill={t.p} opacity={b.op}/>)}{[16,11,7,3].map((rv,i)=><circle key={i} cx="50" cy="55" r={rv} fill="none" stroke={t.p} strokeWidth=".4" opacity={.05+i*.06} strokeDasharray="2 2"/>)}</>;}
    if(artType==="fire"){const fl=Array.from({length:8},(_,i)=>{const x=10+i*10+r(-3,3,seed+i*3);const h=r(10,26,seed+i*7);const w=r(3,8,seed+i*11);return<polygon key={i} points={`${x} 95,${x-w} ${95-h},${x+w} ${95-h}`} fill={t.p} opacity={.07+i*.05}/>;});const ry=Array.from({length:8},(_,i)=>{const a=(i/8)*Math.PI*2;return<line key={i} x1={50+Math.cos(a)*7} y1={50+Math.sin(a)*7} x2={50+Math.cos(a)*38} y2={50+Math.sin(a)*38} stroke={t.a} strokeWidth=".35" opacity=".15"/>;});return<>{fl}{ry}<circle cx="50" cy="50" r="6" fill={t.p} opacity=".16"/><circle cx="50" cy="50" r="3" fill={t.a} opacity=".3"/></>;}
    if(artType==="gold"){const gems=Array.from({length:8},(_,i)=>{const x=r(10,90,seed+i*13),y=r(10,90,seed+i*17),s=r(4,9,seed+i*7);return<polygon key={i} points={`${x} ${y-s},${x+s} ${y},${x} ${y+s},${x-s} ${y}`} fill="none" stroke={t.p} strokeWidth=".45" opacity={.09+i*.05}/>;});const sp=Array.from({length:14},(_,i)=>({x:r(5,95,seed+i*11),y:r(5,95,seed+i*19)}));const star=Array.from({length:8},(_,i)=>{const a=(i/8)*Math.PI*2,ro=i%2===0?14:6;return`${50+Math.cos(a)*ro} ${50+Math.sin(a)*ro}`;}).join(' ');return<>{gems}{sp.map((s,i)=><circle key={i} cx={s.x} cy={s.y} r=".7" fill={t.p} opacity={.18+i*.02}/>)}<polygon points={star} fill="none" stroke={t.p} strokeWidth=".45" opacity=".28"/><circle cx="50" cy="50" r="4" fill={t.a} opacity=".28"/></>;}
    if(artType==="sky"){const ri=Array.from({length:10},(_,i)=>{const x=5+i*10+r(-3,3,seed+i*3);return<line key={i} x1={x} y1={r(45,88,seed+i*7)} x2={x+r(-4,4,seed+i*11)} y2="10" stroke={t.p} strokeWidth=".35" opacity={.07+i*.04} strokeDasharray="3 2"/>;});const cl=Array.from({length:4},(_,i)=>({cx:r(15,85,seed+i*13),cy:r(12,48,seed+i*17),rx:r(8,18,seed+i*7),ry:r(3,7,seed+i*11)}));return<>{Array.from({length:10},(_,i)=>{const a=(i/10)*Math.PI*2;return<line key={i} x1="50" y1="18" x2={50+Math.cos(a)*48} y2={18+Math.sin(a)*48} stroke={t.a} strokeWidth=".25" opacity=".09"/>;})}{ri}{cl.map((c,i)=><ellipse key={i} cx={c.cx} cy={c.cy} rx={c.rx} ry={c.ry} fill={t.p} opacity={.04+i*.025}/>)}<circle cx="50" cy="18" r="5" fill={t.p} opacity=".18"/></>;}
    if(artType==="earth"){const ly=Array.from({length:7},(_,i)=>{const y=20+i*11+r(-3,3,seed+i*7);const pts=Array.from({length:11},(_,j)=>`${j*11} ${y+r(-2,2,seed+i*7+j)}`).join(' ');return<polyline key={i} points={pts} fill="none" stroke={i%2===0?t.p:t.a} strokeWidth=".45" opacity={.09+i*.05}/>;});const lv=Array.from({length:5},(_,i)=>{const x=r(15,85,seed+i*13),y=r(15,80,seed+i*17),s=r(3,7,seed+i*7);return<ellipse key={i} cx={x} cy={y} rx={s} ry={s*.5} fill={t.p} opacity={.07+i*.04} transform={`rotate(${r(-40,40,seed+i*3)} ${x} ${y})`}/>;});return<>{ly}{lv}<path d="M50 80 Q41 71 31 84 M50 80 Q59 71 69 84 M50 80 Q50 66 50 56" fill="none" stroke={t.p} strokeWidth=".55" opacity=".22" strokeLinecap="round"/><circle cx="50" cy="56" r="3.5" fill={t.a} opacity=".28"/></>;}
    const nd=Array.from({length:8},(_,i)=>({x:r(10,90,seed+i*13),y:r(10,90,seed+i*17)}));
    return<>{Array.from({length:6},(_,i)=>{const a=nd[i],b=nd[(i+2)%8];return<line key={i} x1={a.x} y1={a.y} x2={b.x} y2={b.y} stroke={t.p} strokeWidth=".38" opacity=".13"/>;})}{nd.map((n,i)=><circle key={i} cx={n.x} cy={n.y} r={i%3===0?2.3:1.4} fill={t.p} opacity={.18+i*.04}/>)}<circle cx="50" cy="50" r="9" fill="none" stroke={t.a} strokeWidth=".45" opacity=".22" strokeDasharray="3 2"/><circle cx="50" cy="50" r="3.5" fill={t.p} opacity=".28"/></>;
  };
  const kwL=()=>{
    if(!dreamText) return null;
    if(has("용","룡")) return<path d={`M18 78 Q33 ${50+r(-12,12,seed)} 50 50 Q67 ${50+r(-12,12,seed+1)} 82 22`} fill="none" stroke={t.a} strokeWidth="1.1" opacity=".25" strokeLinecap="round"/>;
    if(has("사람","어머니","아버지","할머니","할아버지","남자","여자","친구","남편","아내","아들","딸")) return<g opacity=".16"><circle cx="50" cy="30" r="6.5" fill={t.p}/><path d="M39 54 Q50 42 61 54 L64 78 H36 Z" fill={t.p}/></g>;
    if(has("뱀","동물","강아지","고양이","호랑이","돼지","소","말")) return<path d="M15 70 C32 28 68 72 85 30" fill="none" stroke={t.a} strokeWidth="1.3" opacity=".22" strokeLinecap="round"/>;
    if(has("집","건물","아파트","방")) return<g opacity=".16"><polygon points="50,20 74,44 26,44" fill="none" stroke={t.p} strokeWidth=".75"/><rect x="35" y="44" width="30" height="29" fill="none" stroke={t.p} strokeWidth=".75"/><rect x="44" y="57" width="12" height="16" fill={t.p} opacity=".28"/></g>;
    return null;
  };
  return(
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" style={{width:"100%",height:"100%",display:"block",background:t.bg}}>
      <defs><radialGradient id={`rg${seed}`} cx="50%" cy="40%" r="65%"><stop offset="0%" stopColor={t.s} stopOpacity=".28"/><stop offset="100%" stopColor={t.bg} stopOpacity="0"/></radialGradient><filter id={`bl${seed}`}><feGaussianBlur stdDeviation="1.1"/></filter></defs>
      <rect width="100" height="100" fill={`url(#rg${seed})`}/>
      {Array.from({length:9},(_,i)=><line key={"h"+i} x1="0" y1={i*12} x2="100" y2={i*12} stroke={t.p} strokeWidth=".11" opacity=".06"/>)}
      {Array.from({length:9},(_,i)=><line key={"v"+i} x1={i*12} y1="0" x2={i*12} y2="100" stroke={t.p} strokeWidth=".11" opacity=".06"/>)}
      {special()}{kwL()}
      {Array.from({length:3},(_,i)=><circle key={i} cx={r(22,78,seed+i*31)} cy={r(22,78,seed+i*37)} r={r(7,16,seed+i*23)} fill={i%2===0?t.p:t.s} opacity={.03+i*.02} filter={`url(#bl${seed})`}/>)}
    </svg>
  );
}

/* ── 당첨 등수 계산 ── */
function calcGrade(myNums, winNums, bonusNum){
  if(!winNums||winNums.length<6) return null;
  const hit = myNums.filter(n=>winNums.includes(n)).length;
  const hasBonus = myNums.includes(bonusNum);
  if(hit===6) return 1;
  if(hit===5&&hasBonus) return 2;
  if(hit===5) return 3;
  if(hit===4) return 4;
  if(hit===3) return 5;
  return 0;
}

/* ── 당첨 확인 입력 컴포넌트 ── */
function WinCheck({entry, onWin}){
  const [nums,setNums]=useState(["","","","","",""]);
  const [bonus,setBonus]=useState("");
  const [result,setResult]=useState(null);
  const refs=Array.from({length:6},()=>useRef(null));
  const bonusRef=useRef(null);

  const handleNum=(i,v)=>{
    const val=v.replace(/\D/g,"").slice(0,2);
    const next=[...nums];next[i]=val;setNums(next);
    if(val.length===2){
      if(i<5) refs[i+1].current?.focus();
      else bonusRef.current?.focus();
    }
  };

  const check=()=>{
    const w=nums.map(n=>parseInt(n)).filter(n=>n>=1&&n<=45);
    const b=parseInt(bonus);
    if(w.length!==6){alert("당첨 번호 6개를 모두 입력해주세요 (1~45)");return;}
    const grade=calcGrade(entry.numbers||[],w,b||0);
    setResult({grade,winNums:w,bonusNum:b||0});
    if(grade>=1&&grade<=3) onWin(entry.id,grade);
  };

  return(
    <div className="win-check">
      <div className="win-check-title">// 🎯 당첨 번호 대조하기</div>
      <div className="win-input-row">
        {nums.map((v,i)=>(
          <input key={i} ref={refs[i]} className="win-num-input" type="text"
            inputMode="numeric" placeholder={i+1} value={v}
            onChange={e=>handleNum(i,e.target.value)}
            style={{borderColor:result&&result.winNums[i]&&(entry.numbers||[]).includes(result.winNums[i])?"var(--go)":undefined}}/>
        ))}
        <div className="win-bonus-label">
          <input ref={bonusRef} className="win-bonus-input" type="text"
            inputMode="numeric" placeholder="+" value={bonus}
            onChange={e=>setBonus(e.target.value.replace(/\D/g,"").slice(0,2))}/>
          <span style={{fontSize:".45rem",color:"var(--dim)"}}>보너스</span>
        </div>
        <button className="win-btn" onClick={check}>확인</button>
      </div>

      {result&&(()=>{
        const g=GRADE_INFO[result.grade]||GRADE_INFO[0];
        return(
          <div className={"win-result "+g.cls}>
            <div className="win-result-icon">{g.icon}</div>
            <div className="win-result-text">
              <div className="win-result-grade">{g.label} {g.prize&&<span style={{fontFamily:"'Share Tech Mono',monospace",fontSize:".65rem",fontWeight:400,opacity:.8}}>({g.prize})</span>}</div>
              <div className="win-result-desc">{g.desc}</div>
              <div className="win-matched">
                {(entry.numbers||[]).map((n,i)=>{
                  const hit=result.winNums.includes(n);
                  return hit
                    ? <div key={i} className={"win-ball-hit "+BC[i]}>{n}</div>
                    : <div key={i} className="win-ball-miss">{n}</div>;
                })}
              </div>
            </div>
          </div>
        );
      })()}
    </div>
  );
}

const OPENAI_KEY = "";

async function generateDreamImage(prompt) {
  if (OPENAI_KEY) {
    const r = await fetch("https://api.openai.com/v1/images/generations", {
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+OPENAI_KEY},
      body:JSON.stringify({model:"dall-e-3",prompt,n:1,size:"1024x1024",quality:"standard"})
    });
    const d = await r.json();
    if (d.data?.[0]?.url) return d.data[0].url;
  }
  // 무료 대안: Pollinations.ai
  const ghibliPrompt="Studio Ghibli anime style, hand-drawn watercolor, soft warm colors, magical dreamy atmosphere, Miyazaki inspired, peaceful and beautiful, "+prompt;
  return "https://image.pollinations.ai/prompt/"+encodeURIComponent(ghibliPrompt)
    +"?width=1280&height=854&nologo=true&seed="+Math.floor(Math.random()*9999);
}

const SYS=`당신은 DreamPick 6의 AI 꿈 해몽 엔진입니다. 동양 오행 수리학을 기반으로 번호를 선정합니다. 순수 JSON만 반환하세요. 마크다운 없이.

【동양 오행 수리학 번호 선정 원칙】

오행 배속과 수리:

- 土(토, sky):   기본수 5·10, 상생수 2·7 → 확장: 5,10,15,20,25,30,35,40,45 중 선택

번호 선정 절차:
1. 꿈의 art_type으로 주오행 결정
2. 주오행 기본수 계열에서 2개 선택
3. 상생오행 수 계열에서 2개 선택
4. 꿈 속 핵심 요소(사람→土, 동물→木, 하늘·빛→火, 물·비→水, 금속·보석→金)의 오행에서 2개 추가

number_reasons 작성: 각 번호마다 오행 배속 근거 + 꿈 연결 이유를 2~3문장으로 설명

art_type: 물/강/비→water, 불/화재/태양→fire, 금/보석/동전→gold, 하늘/날기/구름→sky, 숲/흙/나무→earth, 그외→default

4. 사람 등장 시 온화하고 밝은 표정, 어둡거나 불안한 요소 절대 금지`;

function PWAInstall(){
  const [showBanner, setShowBanner] = React.useState(false);
  const [showIOS, setShowIOS] = React.useState(false);
  const [bannerHide, setBannerHide] = React.useState(false);
  const [deferredPrompt, setDeferredPrompt] = React.useState(null);
  const [isInstalled, setIsInstalled] = React.useState(false);
  const [isIOS, setIsIOS] = React.useState(false);

  React.useEffect(()=>{
    // 이미 설치된 경우 숨김
    if(window.matchMedia('(display-mode: standalone)').matches){
      setIsInstalled(true); return;
    }
    if(localStorage.getItem('pwa_dismissed')) return;

    // iOS 감지
    const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
    setIsIOS(ios);

    if(!ios){
      window.addEventListener('beforeinstallprompt', (e)=>{
        e.preventDefault();
        setDeferredPrompt(e);
      });
      window.addEventListener('appinstalled', ()=>{
        setIsInstalled(true);
        setShowBanner(false);
      });
    }
    const showIt=()=>{
      if(localStorage.getItem('pwa_dismissed')) return;
      setShowBanner(true);
    };
    const showIOSModal=()=>{ setShowIOS(true); };
    window.addEventListener('show-ios-install', showIOSModal);
    if(!localStorage.getItem('pwa_dismissed') && localStorage.getItem('dp6_agreed')){
      setTimeout(showIt, 3000);
    } else if(!localStorage.getItem('pwa_dismissed')){
      window.addEventListener('show-pwa-banner', showIt);
    }
    return ()=>{
      window.removeEventListener('show-pwa-banner', showIt);
      window.removeEventListener('show-ios-install', showIOSModal);
    };
  },[]);

  const handleInstall = async ()=>{
    if(isIOS){
      setShowBanner(false);
      setShowIOS(true);
      return;
    }
    if(deferredPrompt){
      deferredPrompt.prompt();
      const result = await deferredPrompt.userChoice;
      if(result.outcome==='accepted') setIsInstalled(true);
      setDeferredPrompt(null);
      handleDismiss();
    } else {
      alert('브라우저 메뉴(⋮) → 홈 화면에 추가를 선택해 주세요!');
      handleDismiss();
    }
  };

  const handleDismiss = ()=>{
    setBannerHide(true);
    localStorage.setItem('pwa_dismissed','1');
    setTimeout(()=>setShowBanner(false), 320);
  };

  if(isInstalled) return null;

  return(
    <React.Fragment>
      {/* 하단 설치 배너 */}
      {showBanner&&(
        <div className={"pwa-banner"+(bannerHide?" hide":"")}>
          <div className="pwa-icon">🌙</div>
          <div className="pwa-text">
            <div className="pwa-title">앱으로 설치하기</div>
            <div className="pwa-desc">
              홈 화면에 추가하면 <span>앱처럼 바로 실행</span>됩니다
            </div>
          </div>
          <div className="pwa-btns">
            <button className="pwa-btn-close" onClick={handleDismiss}>✕</button>
            <button className="pwa-btn-install" onClick={handleInstall}>
              "설치하기"
            </button>
          </div>
        </div>
      )}

      {/* iOS 설치 안내 모달 */}
      {showIOS&&(
        <div className="ios-modal" onClick={()=>setShowIOS(false)}>
          <div className="ios-box" onClick={e=>e.stopPropagation()}>
            <div className="ios-title">🌙 DreamPick 6 설치하기</div>
            <div className="ios-sub">
              아이폰은 아래 방법으로 홈 화면에 앱을 추가할 수 있어요
              <br/>
              <span style={{fontSize:".7rem",color:"rgba(0,212,255,0.6)"}}>Safari 브라우저에서만 가능합니다</span>
            </div>
            <div className="ios-steps">
              <div className="ios-step">
                <div className="ios-num">1</div>
                <div className="ios-step-icon">
                  <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="1" y="1" width="26" height="26" rx="6" fill="rgba(0,212,255,0.15)" stroke="rgba(0,212,255,0.5)" strokeWidth="1.5"/>
                    <rect x="8" y="14" width="12" height="9" rx="2" fill="none" stroke="rgba(0,212,255,0.8)" strokeWidth="1.5"/>
                    <line x1="14" y1="4" x2="14" y2="15" stroke="rgba(0,212,255,0.8)" strokeWidth="1.5" strokeLinecap="round"/>
                    <polyline points="10,8 14,4 18,8" fill="none" stroke="rgba(0,212,255,0.8)" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
                  </svg>
                </div>
                <div className="ios-step-text">

          <div className="pl">Dream Input Terminal</div>
          <textarea className="ta" placeholder="꿈의 내용을 자세히 입력하세요... (예: 강에서 큰 잉어를 잡았는데 용이 되어 하늘로 날아갔어요)" value={txt} onChange={e=>setTxt(e.target.value)} disabled={loading}/>
          <button className="btn" onClick={analyze} disabled={loading||!txt.trim()}>
            {loading&&<div className="cl"/>}
            {loading?<span className="ld">회로 분석중<span>.</span><span>.</span><span>.</span></span>:hasAnalyzed?"🔄 꿈 다시 분석하기 · RE-ANALYZE":"⚡ 꿈 분석하기 · ANALYZE"}
          </button>
          {err&&<div className="et">{err}</div>}
        </div>

        {res&&(
          <div className="da">
            <div className="dg">
              {showCard?(
                <div className="p dc-wrap" ref={cardRef}>
                  <div className="dc">
                    {/* AI 이미지 or SVG 폴백 */}
                    {dreamImg ? (
                      <img src={dreamImg} alt="Dream Vision"
                        style={{width:"100%",height:"100%",objectFit:"cover",display:"block",borderRadius:12}}
                        onError={()=>setDreamImg(null)}/>
                    ) : imgLoading ? (
                      <div style={{width:"100%",height:"100%",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",background:"#020510",gap:14}}>
                        <div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:".6rem",color:"var(--az)",letterSpacing:".15em",animation:"stB .8s ease infinite alternate"}}>✦ AI 이미지 생성 중...</div>
                        <div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:".52rem",color:"var(--dim)",letterSpacing:".1em"}}>꿈의 비전을 그리고 있어요</div>
                        <DreamArt artType={type} seed={seed} dreamText={curTxt}/>
                      </div>
                    ) : (
                      <DreamArt artType={type} seed={seed} dreamText={curTxt}/>
                    )}
                    {/* 카드 하단 텍스트 오버레이 */}
                    <div className="dc-ot">
                      <div className="dc-dt">"{curTxt}"</div>
                      <div className="dc-it">{curInt.slice(0,55)}{curInt.length>55?"...":""}</div>
                    </div>
                    <div className="dc-tr">
                      <div className="dc-badge">{type.toUpperCase()}</div>
                      <div className="dc-lbl">{dreamImg?"AI VISION":"DREAM VISION"}</div>
                    </div>
                  </div>
                </div>
              ):(
                <div className="p" style={{marginBottom:0,display:"flex",alignItems:"center",justifyContent:"center",minHeight:170}}>
                  <span style={{fontFamily:"'Share Tech Mono',monospace",fontSize:".63rem",color:"var(--dim)",letterSpacing:".15em"}}>{showOv?"// RENDERING...":"// STANDBY"}</span>
                </div>
              )}
              <div className="p gau" style={{marginBottom:0}}>
                <div className="cd tl"/><div className="cd tr"/>
                <div className="pl">오늘의 운세 점수</div>
                <Gauge label="💰 재물운" value={res.wealth} cls="gw" delay={120}/>
                <Gauge label="❤️ 애정운" value={res.love}   cls="gl" delay={380}/>
                <Gauge label="⭐ 성공운" value={res.success} cls="gs" delay={630}/>
                <ProbBar value={res.prob} delay={900}/>
              </div>
            </div>
            <div className="p"><div className="cd tl"/><div className="cd tr"/><div className="pl">AI 꿈 해몽</div><div className="it">{stream}{streaming&&<span className="ic"/>}</div></div>
            <div className="p"><div className="cd tl"/><div className="cd tr"/><div className="cd bl"/><div className="cd br"/>
              <div className="pl" style={{fontSize:".75rem",letterSpacing:".18em",color:"var(--go)",display:"flex",alignItems:"center",gap:8}}>🎱 <span>Lucky 6</span> <span style={{opacity:.6,fontSize:".6rem"}}>— 오행 수리학 기반 추천 번호</span></div>
              <OhaengBanner artType={type} ohaengInfo={res.ohaeng_info}/>
              <Lucky numbers={res.lucky_numbers} reasons={res.number_reasons}/>
              <BonusSets sets={res.bonus_sets}/>
            </div>
            <SharePanel res={res} dreamText={curTxt} artType={type} artSeed={seed} cardRef={cardRef} dreamImg={dreamImg}/>
            <CoupangPanel artType={type}/>
          </div>
        )}

        <JournalSection
          journal={journal}
          sharedJournal={sharedJournal}
          sharedLoading={sharedLoading}
          onWin={handleWin}
          onClear={()=>{setJournal(SAMPLES);localStorage.removeItem('dp6_journal');}}
        />

        {/* ── 푸터 ── */}
        <div className="footer">
          <div className="footer-links">
            <span className="footer-link" onClick={()=>{setModalTab("privacy");setShowModal(true);}}>개인정보처리방침</span>
            <span className="footer-link" onClick={()=>{setModalTab("terms");setShowModal(true);}}>이용약관</span>
            <span className="footer-link" onClick={()=>window.open("mailto:help@dreampick6.app")}>문의하기</span>
          </div>
          <div className="footer-copy">© 2025 DreamPick 6 · All rights reserved</div>
          <div className="footer-coupang">이 서비스는 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</div>
        </div>
      </div>

      {/* ── PWA 설치 배너 ── */}
      <PWAInstall/>

      {/* ── 축하 오버레이 (1·2등) ── */}
      {confettiGrade&&<ConfettiOverlay grade={confettiGrade} onClose={()=>setConfettiGrade(null)}/>}

      {/* ── 하단 동의 배너 ── */}
      {showBanner&&(
        <div className={"consent-banner"+(bannerHide?" hide":"")}>
          <div className="consent-icon">🔒</div>
          <div className="consent-text">
            DreamPick 6는 서비스 제공을 위해 입력하신 꿈 내용을 AI 분석 및 이미지 생성에 활용합니다.
            서비스 이용 시 <a onClick={()=>{setModalTab("terms");setShowModal(true);}}>이용약관</a> 및 <a onClick={()=>{setModalTab("privacy");setShowModal(true);}}>개인정보처리방침</a>에 동의한 것으로 간주됩니다.
            <span className="cp-note">본 서비스는 오락 목적이며 실제 미래를 예측하지 않습니다. · 쿠팡 파트너스 제휴 서비스</span>
          </div>
          <div className="consent-btns">
            <button className="consent-btn-detail" onClick={()=>{setModalTab("privacy");setShowModal(true);}}>자세히 보기</button>
            <button className="consent-btn-agree" onClick={agree}>동의하고 시작하기</button>
          </div>
        </div>
      )}

      {/* ── 약관 모달 ── */}
      {showModal&&(
        <div className="modal-overlay" onClick={e=>{if(e.target.className==="modal-overlay")setShowModal(false);}}>
          <div className="modal-box">
            <div className="modal-header">
              <div className="modal-title">📋 법적 고지</div>
              <button className="modal-close" onClick={()=>setShowModal(false)}>✕ 닫기</button>
            </div>
            <div className="modal-tabs">
              <div className={"modal-tab"+(modalTab==="privacy"?" act":"")} onClick={()=>setModalTab("privacy")}>개인정보처리방침</div>
              <div className={"modal-tab"+(modalTab==="terms"?" act":"")} onClick={()=>setModalTab("terms")}>이용약관</div>
            </div>
            <div className="modal-body">
              {modalTab==="privacy"&&(
                <div>
                  <p><strong>시행일:</strong> 2025년 3월 20일</p>
                  <h3>수집 항목</h3>
                  <p>서비스는 회원가입 없이 이용 가능하며, 이름·연락처 등 직접 식별 가능한 개인정보는 수집하지 않습니다. 이용자가 입력한 꿈 내용은 AI 분석 목적으로만 사용됩니다.</p>
                  <h3>AI 서비스 활용 고지</h3>
                  <div className="warn-box">
                    <p>입력하신 꿈 내용은 다음 AI 서비스에 전달됩니다.</p>
                    <ul>
                      <li><strong>Claude API (Anthropic)</strong> — 꿈 해몽 분석</li>
                      <li><strong>DALL-E 3 (OpenAI) / Pollinations.ai</strong> — Dream Vision 이미지 생성</li>
                    </ul>
                    <p>전달된 내용은 분석 후 즉시 삭제되며 별도 서버에 저장되지 않습니다.</p>
                  </div>
                  <h3>보유 기간</h3>
                  <p>별도 서버에 저장하지 않으며, 브라우저 로컬 저장소에만 저장되며, 서버로 전송되지 않습니다.</p>
                  <h3>제3자 위탁</h3>
                  <ul>
                    <li>Anthropic (Claude API) — 꿈 텍스트 분석</li>
                    <li>OpenAI / Pollinations.ai — AI 이미지 생성</li>
                    <li>쿠팡 파트너스 — 제휴 상품 추천</li>
                  </ul>
                  <h3>이용자 권리</h3>
                  <p>개인정보 관련 문의는 help@dreampick6.app 으로 연락하시면 영업일 기준 10일 이내 처리합니다.</p>
                  <h3>만 14세 미만</h3>
                  <p>만 14세 미만 이용자는 법정대리인 동의가 필요합니다.</p>
                </div>
              )}
              {modalTab==="terms"&&(
                <div>
                  <p><strong>시행일:</strong> 2025년 3월 20일</p>
                  <h3>서비스 목적 및 성격</h3>
                  <div className="warn-box">
                    <p>⚠️ DreamPick 6는 <strong>오락·참고 목적</strong>으로만 제공됩니다. AI 해몽 결과, 운세 점수, 추천 번호는 과학적 근거가 없으며 실제 복권 당첨이나 미래 예측을 보장하지 않습니다.</p>
                  </div>
                  <h3>이용 자격</h3>
                  <p>만 14세 이상 누구나 이용 가능합니다. 만 14세 미만은 법정대리인 동의가 필요합니다.</p>
                  <h3>AI 생성 콘텐츠</h3>
                  <p>Dream Vision 카드는 AI가 생성한 이미지로 실제 사진이 아닙니다. 이용자는 개인적 용도로 자유롭게 사용할 수 있습니다.</p>
                  <h3>이용자 의무</h3>
                  <ul>
                    <li>타인의 개인정보를 무단으로 입력하지 않습니다</li>
                    <li>불법·음란·혐오적 내용을 입력하지 않습니다</li>
                    <li>AI 결과를 사실인 것처럼 허위 유포하지 않습니다</li>
                  </ul>
                  <h3>쿠팡 파트너스</h3>
                  <p>본 서비스는 쿠팡 파트너스 활동의 일환으로 제품을 추천하며, 이에 따른 일정액의 수수료를 제공받을 수 있습니다.</p>
                  <h3>면책 조항</h3>
                  <ul>
                    <li>AI 해몽 및 운세 결과는 오락 목적이며 실제 결과와 다를 수 있습니다</li>
                    <li>추천 로또 번호의 당첨을 보장하지 않습니다</li>
                    <li>외부 API 장애로 인한 서비스 중단에 대해 책임을 제한합니다</li>
                  </ul>
                  <h3>준거법</h3>
                  <p>본 약관은 대한민국 법률에 따라 해석됩니다.</p>
                </div>
              )}
            </div>
            <div className="modal-footer">
              <button className="modal-agree-btn" onClick={()=>{setShowModal(false);agree();}}>동의하고 시작하기</button>
            </div>
          </div>
        </div>
      )}
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
